<div class="charts" *ngIf="isLoaded">
  <mat-grid-list cols="1" rowHeight="500px">
    <mat-card>
      <div class="dashboard-header">
        <h3>Postagens por</h3>
        <mat-form-field appearance="outline" class="dropdown">
          <mat-select
            [(value)]="selectedView"
            (selectionChange)="onViewChange()"
          >
            <mat-option value="user">Usuário</mat-option>
            <mat-option value="category">Categoria</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <canvas
        baseChart
        [data]="chartData"
        [type]="'bar'"
        [options]="chartOptions"
      ></canvas>
    </mat-card>
  </mat-grid-list>

  <mat-grid-list cols="2" gutterSize="16px" rowHeight="300px" class="cards">
    <mat-grid-tile>
      <mat-card>
        <mat-card-title>Usuário com mais postagens</mat-card-title>
        <div class="content-wrapper">
          <mat-card-content>{{ topUser?.username }} </mat-card-content>
          <mat-card-content>{{ topUserPosts }} </mat-card-content>
        </div>
      </mat-card>
    </mat-grid-tile>

    <mat-grid-tile>
      <mat-card>
        <mat-card-title>Categoria com mais postagens</mat-card-title>
        <div class="content-wrapper">
          <mat-card-content>{{ topCategory?.title }} </mat-card-content>
          <mat-card-content>{{ topCategoryPosts }} </mat-card-content>
        </div>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
  <div *ngIf="errorMsg" class="error-msg">
    {{ errorMsg }}
  </div>
</div>
